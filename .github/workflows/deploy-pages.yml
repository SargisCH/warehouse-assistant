name: Deploy assistant to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: warehouse-assistant-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
      GENERATE_SOURCEMAP: 'false'
      REACT_APP_API_URL: ${{ secrets.API_URL }}
      REACT_APP_COGNITO_USER_POOL_ID: ${{ vars.COGNITO_USER_POOL_ID }}
      REACT_APP_COGNITO_CLIENT_ID: ${{ vars.COGNITO_CLIENT_ID }}
      REACT_APP_WAREHOUSE_URL: ${{ vars.WAREHOUSE_URL }}
      PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Validate deployment settings
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node <<'NODE'
          const required = [
            'REACT_APP_API_URL', 'REACT_APP_COGNITO_USER_POOL_ID',
            'REACT_APP_COGNITO_CLIENT_ID', 'PAGES_PROJECT',
            'CLOUDFLARE_API_TOKEN', 'CLOUDFLARE_ACCOUNT_ID',
          ];
          for (const name of required) {
            if (!process.env[name]?.trim()) throw new Error(`Missing configuration: ${name}`);
          }
          const api = new URL(process.env.REACT_APP_API_URL);
          if (api.protocol !== 'https:' || !api.pathname.endsWith('/api/v1/') || api.search || api.hash || api.username || api.password) {
            throw new Error('API_URL must be an HTTPS API URL ending in /api/v1/, without credentials, query or fragment.');
          }
          if (!/^[a-z0-9][a-z0-9-]*$/.test(process.env.PAGES_PROJECT)) {
            throw new Error('CLOUDFLARE_PAGES_PROJECT must be a Pages project name.');
          }
          if (process.env.REACT_APP_WAREHOUSE_URL && new URL(process.env.REACT_APP_WAREHOUSE_URL).protocol !== 'https:') {
            throw new Error('WAREHOUSE_URL must use HTTPS.');
          }
          NODE
      - run: npm ci
      - name: Test
        run: npm test -- --watchAll=false --runInBand
      - name: Build
        run: npm run build
      - name: Deploy prebuilt assets
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy build --project-name=${{ env.PAGES_PROJECT }} --branch=${{ github.ref_name }}
